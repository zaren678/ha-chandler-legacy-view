alias: "Treatment Valve — Correct valve clock"
description: >-
  Refresh every six hours, then synchronize only when the freshly read valve
  clock differs from Home Assistant local time by more than five minutes.
id: treatment_valve_correct_clock
mode: single
trigger:
  - platform: time_pattern
    hours: "/6"
    minutes: "5"
    seconds: "0"
condition:
  - condition: state
    entity_id: sensor.mechanical_room_treatment_valve_treatment_valve_backwash_state
    state: "Idle"
  - condition: template
    value_template: >-
      {% set refresh = states.button.mechanical_room_treatment_valve_treatment_valve_refresh_now %}
      {{ refresh is defined and refresh.state != 'unavailable' }}
  - condition: template
    value_template: >-
      {% set sync = states.button.mechanical_room_treatment_valve_treatment_valve_sync_time %}
      {{ sync is defined and sync.state != 'unavailable' }}
action:
  - service: button.press
    continue_on_error: true
    target:
      entity_id: button.mechanical_room_treatment_valve_treatment_valve_refresh_now
  - delay: "00:00:15"
  - if:
      - condition: template
        value_template: >-
          {% set raw = states('sensor.treatment_valve_treatment_valve_time_of_day') %}
          {% set last = states('sensor.treatment_valve_treatment_valve_last_successful_update') %}
          {% set parsed = strptime(raw, '%I:%M %p', none) %}
          {% if parsed is none %}
            false
          {% else %}
            {% set valve_minutes = parsed.hour * 60 + parsed.minute %}
            {% set local_minutes = now().hour * 60 + now().minute %}
            {% set difference = ((valve_minutes - local_minutes + 720) % 1440) - 720 %}
            {{ (as_timestamp(now()) - as_timestamp(last, 0)) < 60
               and difference | abs > 5 }}
          {% endif %}
    then:
      - service: button.press
        target:
          entity_id: button.mechanical_room_treatment_valve_treatment_valve_sync_time
