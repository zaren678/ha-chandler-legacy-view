alias: "Treatment Valve — Bluetooth recovery"
description: >-
  Power-cycle the filter when the integration's Recovery Required diagnostic
  turns on after three failed dashboard refresh attempts.
id: treatment_valve_bluetooth_watchdog
mode: single
max_exceeded: silent
trigger:
  - platform: state
    entity_id: binary_sensor.mechanical_room_treatment_valve_treatment_valve_recovery_required
    to: "on"
  - platform: time_pattern
    minutes: "/5"
condition:
  - condition: state
    entity_id: binary_sensor.mechanical_room_treatment_valve_treatment_valve_recovery_required
    state: "on"
  - condition: state
    entity_id: switch.unnamed_p316m_tapo_p316m_2
    state: "on"
action:
  - service: system_log.write
    data:
      level: warning
      logger: custom_components.chandler_legacy_view.automation
      message: >-
        Treatment Valve requires external recovery after three failed
        dashboard refreshes; power-cycling the filter.
  - service: switch.turn_off
    continue_on_error: true
    target:
      entity_id: switch.unnamed_p316m_tapo_p316m_2
  - delay: "00:00:30"
  - repeat:
      count: 3
      sequence:
        - service: switch.turn_on
          continue_on_error: true
          target:
            entity_id: switch.unnamed_p316m_tapo_p316m_2
        - delay: "00:00:10"
  - if:
      - condition: not
        conditions:
          - condition: state
            entity_id: switch.unnamed_p316m_tapo_p316m_2
            state: "on"
    then:
      - service: persistent_notification.create
        data:
          title: "Treatment Valve recovery: plug did not turn on"
          message: >-
            The recovery automation tried three times to restore power to
            switch.unnamed_p316m_tapo_p316m_2. Check the smart plug immediately.
  - delay: "00:03:00"
  - if:
      - condition: template
        value_template: >-
          {{ states('button.mechanical_room_treatment_valve_treatment_valve_refresh_now')
             not in ['unknown', 'unavailable'] }}
    then:
      - service: button.press
        continue_on_error: true
        target:
          entity_id: button.mechanical_room_treatment_valve_treatment_valve_refresh_now
  - delay: "00:00:15"
  - service: system_log.write
    data:
      level: info
      logger: custom_components.chandler_legacy_view.automation
      message: >-
        Treatment Valve recovery attempt completed. Recovery Required={{
        states('binary_sensor.mechanical_room_treatment_valve_treatment_valve_recovery_required') }}
  - delay: "00:30:00"
