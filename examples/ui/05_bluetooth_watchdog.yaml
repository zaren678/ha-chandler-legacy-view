alias: "Treatment Valve — Bluetooth watchdog"
description: >-
  Power-cycle the filter after Last Successful Update is more than 35 minutes
  old. Wait for rediscovery, request a refresh, then enforce a retry cooldown.
id: treatment_valve_bluetooth_watchdog
mode: single
max_exceeded: silent
trigger:
  - platform: time_pattern
    minutes: "/5"
condition:
  - condition: template
    value_template: >-
      {% set update = states.sensor.treatment_valve_treatment_valve_last_successful_update %}
      {% if update is not defined %}
        false
      {% elif update.state in ['unknown', 'unavailable'] %}
        {{ (as_timestamp(now()) - as_timestamp(update.last_changed)) > 2100 }}
      {% else %}
        {{ (as_timestamp(now()) - as_timestamp(update.state, 0)) > 2100 }}
      {% endif %}
  - condition: template
    value_template: >-
      {{ states('sensor.mechanical_room_treatment_valve_treatment_valve_backwash_state')
         in ['Idle', 'unknown', 'unavailable'] }}
  - condition: state
    entity_id: switch.unnamed_p316m_tapo_p316m_2
    state: "on"
action:
  - service: system_log.write
    data:
      level: warning
      logger: custom_components.chandler_legacy_view.automation
      message: >-
        Treatment Valve dashboard data is stale; power-cycling the filter.
        Last successful update={{ states('sensor.treatment_valve_treatment_valve_last_successful_update') }}
  - service: switch.turn_off
    continue_on_error: true
    target:
      entity_id: switch.unnamed_p316m_tapo_p316m_2
  - delay: "00:00:30"
  - repeat:
      count: 3
      sequence:
        - service: switch.turn_on
          continue_on_error: true
          target:
            entity_id: switch.unnamed_p316m_tapo_p316m_2
        - delay: "00:00:10"
  - if:
      - condition: not
        conditions:
          - condition: state
            entity_id: switch.unnamed_p316m_tapo_p316m_2
            state: "on"
    then:
      - service: persistent_notification.create
        data:
          title: "Treatment Valve watchdog: plug did not turn on"
          message: >-
            The watchdog tried three times to restore power to
            switch.unnamed_p316m_tapo_p316m_2. Check the smart plug immediately.
  - delay: "00:03:00"
  - if:
      - condition: template
        value_template: >-
          {% set refresh = states.button.mechanical_room_treatment_valve_treatment_valve_refresh_now %}
          {{ refresh is defined and refresh.state != 'unavailable' }}
    then:
      - service: button.press
        continue_on_error: true
        target:
          entity_id: button.mechanical_room_treatment_valve_treatment_valve_refresh_now
  - delay: "00:00:15"
  - service: system_log.write
    data:
      level: info
      logger: custom_components.chandler_legacy_view.automation
      message: >-
        Treatment Valve watchdog recovery attempt completed.
        Last successful update={{ states('sensor.treatment_valve_treatment_valve_last_successful_update') }}
  - delay: "00:30:00"
